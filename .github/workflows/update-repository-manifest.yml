name: Update Repository Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - repository_manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repository-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate repository manifest
        run: python scripts/generate_repository_manifest.py

      - name: Check manifest diff
        id: manifest_diff
        shell: bash
        run: |
          if git diff --quiet repository_manifest.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.manifest_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit repository manifest
        if: steps.manifest_diff.outputs.changed == 'true'
        run: |
          git add repository_manifest.yml
          git commit \
            -m "Синхронизация filesystem manifest" \
            -m "Workflow обнаружил изменение canonical main filesystem tree.

Generator перегенерировал
filesystem manifest репозитория.

Manifest остаётся:

* deterministic
* filesystem-only
* tree-only"

      - name: Push repository manifest
        if: steps.manifest_diff.outputs.changed == 'true'
        run: git push
