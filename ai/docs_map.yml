filesystem_truth_layer:
  purpose: "physical filesystem tree visibility"
  source_type: "filesystem_truth"
  files:
    - repository_manifest.yml
    - scripts/generate_repository_manifest.py
    - .github/workflows/update-repository-manifest.yml

ai_navigation_layer:
  purpose: "semantic/navigation tree for GPT/Codex workflow"
  source_type: "semantic_navigation"
  files:
    - ai/README.md
    - ai/current_status.yml
    - ai/docs_map.yml

primary_entrypoints:
  repository:
    - README.md
    - repository_manifest.yml
  ai_navigation:
    - ai/README.md
    - ai/current_status.yml
    - ai/docs_map.yml
  repository_cognition:
