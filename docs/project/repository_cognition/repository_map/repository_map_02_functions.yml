# Repository Map Functions Layer
# Stage 0.3.4B — corrected semantic function inventory

meta:
  status: corrected_after_reviewer_audit
  purpose: "Bounded semantic inventory of significant runtime functions and orchestration semantics."
  scope: "Semantic function inventory only; not parser dump, full call graph or dependency graph."
  source_of_truth_order:
    - runtime_source_files
    - discovery_batch_01_08
    - repository_map_vocab
    - neighboring_repository_map_layers
  correction_pass:
    missing_render_ui_foundation_functions_added: true
    synthetic_function_record_removed: fn:js/ui/layout:getPanelStyleFactories
    pressure_refs_checked_against_vocab: true

stores:
  - function_inventory
  - lifecycle_functions
  - orchestration_functions
  - bridge_functions
  - callback_targets
  - helper_functions
  - mutation_heavy_functions
  - render_functions
  - validation_functions
  - future_pressure_markers_when_source_confirmed

must_not_store:
  - full_source_code
  - every_local_helper
  - generated_call_graph_dump
  - dependency_graph
  - long_reasoning_blocks
  - refactor_plan
  - automation_logic

selection_rule:
  include_when:
    - lifecycle_ownership
    - orchestration_boundary
    - mutation_heavy_behavior
    - bridge_or_callback_routing
    - render_or_visualization_boundary
    - validation_or_coordinate_mapping_authority
    - source_confirmed_future_pressure
  exclude_when:
    - tiny_local_detail_without_runtime_semantic_weight
    - parser_only_listing
    - speculative_future_architecture

