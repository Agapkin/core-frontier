# Repository Map Functions Layer
# Stage 0.3.4B — function split transition manifest

meta:
  status: transition_manifest_preserved
  role: historical_bridge_lineage_anchor
  purpose: "Compact transition manifest and navigation entrypoint for Repository Map function split layers 02a–02g."
  scope: "Function split bridge only; operational function records now live in split files 02a–02g."
  runtime_authority: runtime_source_files
  repository_map_authority_note: "Repository Map is semantic topology, not runtime authority."
  canonical_reduction_status: manifest_converted_without_deleting_split_authority
  integrity_status: future_integrity_pass_still_required

transition_summary:
  previous_role:
    - old_full_function_inventory
    - legacy_canonical_inventory_during_copy_population
  current_role:
    - transition_manifest
    - historical_bridge
    - split_lineage_anchor
    - function_split_navigation_entrypoint
  split_result:
    operational_function_records_live_in:
      - repository_map_02a_foundation_functions.yml
      - repository_map_02b_core_lifecycle_functions.yml
      - repository_map_02c_gameplay_domain_functions.yml
      - repository_map_02d_runtime_orchestration_functions.yml
      - repository_map_02e_ui_service_functions.yml
      - repository_map_02f_canvas_render_functions.yml
      - repository_map_02g_panel_overlay_functions.yml

function_split_registry:
  - file: repository_map_02a_foundation_functions.yml
    domain: foundation
    source_files:
      - js/data.js
      - js/state.js
    role: operational_split_inventory
  - file: repository_map_02b_core_lifecycle_functions.yml
    domain: core_lifecycle
    source_files:
      - js/systems/systems.js
    role: operational_split_inventory
  - file: repository_map_02c_gameplay_domain_functions.yml
    domain: gameplay_domain
    source_files:
      - js/systems/systems_wave_manager.js
      - js/systems/systems_placement.js
      - js/systems/systems_selected_object_actions.js
    role: operational_split_inventory
  - file: repository_map_02d_runtime_orchestration_functions.yml
    domain: runtime_orchestration
    source_files:
      - js/game.js
    role: operational_split_inventory
  - file: repository_map_02e_ui_service_functions.yml
    domain: ui_service
    source_files:
      - js/ui/helpers.js
      - js/ui/controls.js
      - js/ui/layout.js
      - js/ui/notifications.js
    role: operational_split_inventory
  - file: repository_map_02f_canvas_render_functions.yml
    domain: canvas_render
    source_files:
      - js/ui/canvas_world.js
      - js/ui/canvas_entities.js
    role: operational_split_inventory
  - file: repository_map_02g_panel_overlay_functions.yml
    domain: panel_overlay
    source_files:
      - js/ui/panels.js
    role: operational_split_inventory

preservation_notes:
  - "Old full inventory was split into 02a–02g to reduce giant YAML pressure and clarify operational function authority."
  - "This file remains preserved for lineage/provenance and navigation during the transition."
  - "This manifest does not delete historical meaning; it points to the active split inventories."
  - "Future integrity/reduction checks may still be required before treating the transition as fully closed."
  - "Runtime/source files remain absolute authority if Repository Map wording conflicts with code behavior."

must_not_claim:
  - migration_permanently_complete
  - parity_permanently_guaranteed
  - future_integrity_pass_unnecessary
  - legacy_history_removable_without_review
  - repository_map_runtime_authority

anti_entropy_notes:
  - "Do not reintroduce full function records into this legacy manifest."
  - "Do not treat this manifest as a parser dump, call graph or dependency graph."
  - "Do not use this manifest to hide future source-confirmed corrections needed in split files."
  - "Do not remove this file without a separate approved integrity/pass decision."
  - "Operational function cognition belongs in 02a–02g."
