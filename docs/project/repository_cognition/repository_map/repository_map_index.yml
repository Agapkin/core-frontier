# Repository Map Index
# Stage 0.3.4B — partially populated package manifest

meta:
  package: repository_map
  status: partially_populated
  purpose: "Root manifest and navigation layer for the split Repository Map package."
  scope: "Compressed operational semantic topology; vocab, file inventory and current function inventory are populated; risks/evidence are minimally anchored for file inventory refs; foundation split file is copy-populated for parity verification; remaining function split skeletons are pending migration; remaining layers are skeleton-only."

package_purpose:
  - "Provide compact navigation across Repository Map package layers."
  - "Preserve structured cognition without duplicating Discovery prose."
  - "Keep repository cognition split, bounded and synchronization-aware."

package_philosophy:
  repository_map_is:
    - compressed_semantic_topology
    - structured_inventory_layer
    - evidence_linked_navigation_layer
  repository_map_is_not:
    - runtime_authority
    - discovery_copy
    - automation_engine
    - governance_system
    - dependency_graph_dump
  authority_boundary: "Runtime/source code remains absolute authority."
  discovery_boundary: "Discovery remains archival evidence layer."
  hotspot_boundary: "Hotspots are diagnostic telemetry only, not refactor commands."

layer_separation:
  vocab: "Shared type vocabulary; currently populated."
  files: "File-level semantic inventory; currently populated for Discovery-covered runtime/surface files."
  functions: "Current canonical full function inventory; populated and not yet migrated to split files."
  function_split_skeletons: "Prepared future split files for function-layer migration; only foundation split file is copy-populated for parity verification."
  relationships: "Semantic topology links; skeleton-only."
  surfaces: "DOM/CSS/canvas/surface topology; skeleton-only."
  risks_pressure: "Risk and semantic pressure anchors; minimally anchored for file inventory refs only."
  evidence_refs: "Lightweight archival evidence references; minimally anchored for file inventory refs only."
  hotspots: "Cross-layer diagnostic telemetry; skeleton-only."

