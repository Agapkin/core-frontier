  - "Do not copy Discovery prose into Repository Map."
  - "Do not maintain generated data manually."
  - "Do not collapse split package into one giant YAML file."
  - "Do not convert hotspot telemetry into refactor commands."
  - "Do not treat partially populated package as runtime authority."
