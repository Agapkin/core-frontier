# Repository Map Relationships Layer

meta:
  status: split_index_router_pending_future_population
  purpose: "Semantic relationship topology between Repository Map entities."
  scope: "Policy scaffold, split registry and bounded relationship routing layer; operational records live in 03a–03g split files."
  verification_model: "Relationships must be source-confirmed or evidence-confirmed before population."
  authority_model: "Runtime/source files and repository_manifest.yml remain verification authority."
  non_goals:
    - runtime_authority
    - generated_dependency_graph
    - full_call_graph
    - broad_topology_dump
    - duplicated_file_or_function_inventory

relationship_type_policy:
  allowed_types_from_vocab:
    - owns
    - does_not_own
    - reads
    - mutates
    - used_by
    - calls
    - calls_without_ownership
    - bridges_to
    - depends_on_load_order
    - cross_verifies_with
    - renders
    - visualizes_without_owning
    - mutates_without_owning_shape
    - provides_helper_for
    - shadows
    - derived_from
  rule: "Do not introduce new relationship types during population without vocab alignment pass."

relationship_groups:
  filesystem_truth_infrastructure:
    purpose: "workflow/script/manifest chain"
    allowed_types:
      - calls
      - mutates
      - derived_from
      - cross_verifies_with
  runtime_load_order:
    purpose: "browser-global script order from index.html"
    allowed_types:
      - depends_on_load_order
  repository_map_function_split:
    purpose: "relationship between legacy 02 manifest and active 02a-02g split inventories"
    allowed_types:
      - derived_from
      - cross_verifies_with
  runtime_lifecycle_bridges:
    purpose: "high-value runtime bridges where orchestration delegates to extracted helpers"
    allowed_types:
      - calls
      - calls_without_ownership
      - bridges_to
      - mutates
  runtime_coordinate_mapping:
    purpose: "coordinate/camera helper relations where source-confirmed and operationally useful"
    allowed_types:
      - provides_helper_for
      - calls
      - mutates
  runtime_validation_flow:
    purpose: "Placement/build validation decision chains and validation helper topology."
    allowed_types:
      - calls
      - provides_helper_for
      - mutates
      - bridges_to
  runtime_render_boundaries:
    purpose: "Visualization/render relationships that must not imply gameplay ownership."
    allowed_types:
      - renders
      - visualizes_without_owning
      - reads
      - calls
  runtime_ui_callback_bridges:
    purpose: "UI callback/control dispatch topology without gameplay ownership authority."
    allowed_types:
      - bridges_to
      - calls_without_ownership
      - calls
      - mutates_without_owning_shape
  runtime_state_mutation_hotspots:
    purpose: "High-risk runtime state mutation topology for shared mutable runtime structures."
    allowed_types:
      - mutates
      - mutates_without_owning_shape

split_registry:
  migration_status: "split_records_copied_verified_monolith_cleared"
  current_population_location: "repository_map_03_relationships.yml"
  future_index_role: "policy_router_after_record_migration"
  migration_rule: "Copy records byte-for-byte into split files first; verify identity before removing from monolith."
  split_files:
    - file: repository_map_03a_infrastructure_relationships.yml
      role: infrastructure_relationships
      relationship_groups:
        - filesystem_truth_infrastructure
        - repository_map_function_split
      expected_current_record_count_after_copy: 9

    - file: repository_map_03b_runtime_load_order_relationships.yml
      role: runtime_load_order_relationships
      relationship_groups:
        - runtime_load_order
      expected_current_record_count_after_copy: 5

    - file: repository_map_03c_runtime_lifecycle_relationships.yml
      role: runtime_lifecycle_relationships
      relationship_groups:
        - runtime_lifecycle_bridges
      expected_current_record_count_after_copy: 2

    - file: repository_map_03d_validation_relationships.yml
      role: validation_relationships
      relationship_groups:
        - runtime_validation_flow
      expected_current_record_count_after_copy: 0

    - file: repository_map_03e_ui_callback_relationships.yml
      role: ui_callback_relationships
      relationship_groups:
        - runtime_ui_callback_bridges
      expected_current_record_count_after_copy: 0

    - file: repository_map_03f_render_boundary_relationships.yml
      role: render_boundary_relationships
      relationship_groups:
        - runtime_render_boundaries
      expected_current_record_count_after_copy: 0

    - file: repository_map_03g_state_coordinate_hotspot_relationships.yml
      role: state_coordinate_hotspot_relationships
      relationship_groups:
        - runtime_coordinate_mapping
        - runtime_state_mutation_hotspots
      expected_current_record_count_after_copy: 0

admission_rules:
  - "Relationship must be source-confirmed or evidence-confirmed."
  - "Relationship must be operationally useful."
  - "Relationship must not duplicate file/function inventory."
  - "Relationship must not become a full call graph."
  - "Relationship must not infer ownership from calls."
  - "Relationship must not convert pressure markers into planned systems."
  - "Relationship must preserve source truth hierarchy."
  - "Not every reads/mutates summary from 01_files becomes a relationship record."
  - "Relationships must provide topology, navigation or risk value."
  - "Helper chains should only be populated when operationally meaningful."
  - "Render relations must not imply gameplay ownership."
  - "Callback dispatch must not imply callback ownership."
  - "Mutation edges must not imply state authority ownership."

stores:
  - ownership_relationships
  - mutation_relationships
  - bridge_relationships
  - lifecycle_relationships
  - filesystem_truth_relationships
  - load_order_relationships
  - function_split_relationships
  - coordinate_mapping_relationships
  - validation_flow_relationships
  - render_boundary_relationships
  - ui_callback_bridge_relationships
  - state_mutation_hotspot_relationships

must_not_store:
  - giant_dependency_graphs
  - generated_runtime_traces
  - duplicated_entity_records
  - duplicated_function_inventory
  - discovery_reasoning_prose
  - speculative_topology
  - parser_generated_call_graph

record_shape_example:
  relationship_item:
    relationship_id:
    relationship_type:
    relationship_group:
    source_ref:
    target_ref:
    semantic_strength:
    operational_reason:
    optional_fields:
      source_layer:
      target_layer:
      population_priority:
    optional_fields_rule: "source_layer, target_layer and population_priority are optional; use only when future filtering/grouping pressure requires them."
    evidence_refs: []

relationships: []

anti_entropy_notes:
  - "Relationships should stay operationally meaningful."
  - "Avoid graph explosion."
  - "Keep relationship groups bounded."
  - "Prefer source/evidence-confirmed high-value relations."
  - "Use Discovery only as archival pointer, not truth."
  - "Runtime/source files and repository_manifest.yml remain verification authority."
  - "Do not infer ownership from calls."
  - "Do not populate low-value helper calls."
  - "Avoid helper explosion."
  - "Avoid validation helper spam."
  - "Avoid callback wiring graph explosion."
  - "Avoid render graph duplication."
  - "Prefer high-value topology bridges over exhaustive call tracing."
  - "Preserve compressed cognition rather than exhaustive execution traces."

placeholders:
  future_relationship_population: []
