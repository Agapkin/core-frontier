# Repository Map Relationships Layer

meta:
  status: partially_populated_bounded
  purpose: "Semantic relationship topology between Repository Map entities."
  scope: "Policy scaffold plus bounded source-confirmed relationship population; not runtime authority or generated dependency graph."
  verification_model: "Relationships must be source-confirmed or evidence-confirmed before population."
  authority_model: "Runtime/source files and repository_manifest.yml remain verification authority."
  non_goals:
    - runtime_authority
    - generated_dependency_graph
    - full_call_graph
    - broad_topology_dump
    - duplicated_file_or_function_inventory

relationship_type_policy:
  allowed_types_from_vocab:
    - owns
    - does_not_own
    - reads
    - mutates
    - used_by
    - calls
    - calls_without_ownership
    - bridges_to
    - depends_on_load_order
    - cross_verifies_with
    - renders
    - visualizes_without_owning
    - mutates_without_owning_shape
    - provides_helper_for
    - shadows
    - derived_from
  rule: "Do not introduce new relationship types during population without vocab alignment pass."

relationship_groups:
  filesystem_truth_infrastructure:
    purpose: "workflow/script/manifest chain"
    allowed_types:
      - calls
      - mutates
      - derived_from
      - cross_verifies_with
  runtime_load_order:
    purpose: "browser-global script order from index.html"
    allowed_types:
      - depends_on_load_order
  repository_map_function_split:
    purpose: "relationship between legacy 02 manifest and active 02a-02g split inventories"
    allowed_types:
      - derived_from
      - cross_verifies_with
  runtime_lifecycle_bridges:
    purpose: "high-value runtime bridges where orchestration delegates to extracted helpers"
    allowed_types:
      - calls
      - calls_without_ownership
      - bridges_to
      - mutates
  runtime_coordinate_mapping:
    purpose: "coordinate/camera helper relations where source-confirmed and operationally useful"
    allowed_types:
      - provides_helper_for
      - calls
      - mutates
  runtime_validation_flow:
    purpose: "Placement/build validation decision chains and validation helper topology."
    allowed_types:
      - calls
      - provides_helper_for
      - mutates
      - bridges_to
  runtime_render_boundaries:
    purpose: "Visualization/render relationships that must not imply gameplay ownership."
    allowed_types:
      - renders
      - visualizes_without_owning
      - reads
      - calls
  runtime_ui_callback_bridges:
    purpose: "UI callback/control dispatch topology without gameplay ownership authority."
    allowed_types:
      - bridges_to
      - calls_without_ownership
      - calls
      - mutates_without_owning_shape
  runtime_state_mutation_hotspots:
    purpose: "High-risk runtime state mutation topology for shared mutable runtime structures."
    allowed_types:
      - mutates
      - mutates_without_owning_shape

admission_rules:
  - "Relationship must be source-confirmed or evidence-confirmed."
  - "Relationship must be operationally useful."
  - "Relationship must not duplicate file/function inventory."
  - "Relationship must not become a full call graph."
  - "Relationship must not infer ownership from calls."
  - "Relationship must not convert pressure markers into planned systems."
  - "Relationship must preserve source truth hierarchy."
  - "Not every reads/mutates summary from 01_files becomes a relationship record."
  - "Relationships must provide topology, navigation or risk value."
  - "Helper chains should only be populated when operationally meaningful."
  - "Render relations must not imply gameplay ownership."
  - "Callback dispatch must not imply callback ownership."
  - "Mutation edges must not imply state authority ownership."

stores:
  - ownership_relationships
  - mutation_relationships
  - bridge_relationships
  - lifecycle_relationships
  - filesystem_truth_relationships
  - load_order_relationships
  - function_split_relationships
  - coordinate_mapping_relationships
  - validation_flow_relationships
  - render_boundary_relationships
  - ui_callback_bridge_relationships
  - state_mutation_hotspot_relationships

must_not_store:
  - giant_dependency_graphs
  - generated_runtime_traces
  - duplicated_entity_records
  - duplicated_function_inventory
  - discovery_reasoning_prose
  - speculative_topology
  - parser_generated_call_graph

record_shape_example:
  relationship_item:
    relationship_id:
    relationship_type:
    relationship_group:
    source_ref:
    target_ref:
    semantic_strength:
    operational_reason:
    optional_fields:
      source_layer:
      target_layer:
      population_priority:
    optional_fields_rule: "source_layer, target_layer and population_priority are optional; use only when future filtering/grouping pressure requires them."
    evidence_refs: []

relationships:
  - relationship_id: rel:workflow_update_repository_manifest:calls:generate_repository_manifest
    relationship_group: filesystem_truth_infrastructure
    relationship_type: calls
    source_ref: file:github_workflows/update_repository_manifest
    target_ref: file:scripts/generate_repository_manifest
    semantic_strength: direct_source_confirmed
    operational_reason: "Workflow source runs python scripts/generate_repository_manifest.py."
    evidence_refs:
      - evidence:source:update_repository_manifest_workflow

  - relationship_id: rel:generate_repository_manifest:mutates:repository_manifest
    relationship_group: filesystem_truth_infrastructure
    relationship_type: mutates
    source_ref: file:scripts/generate_repository_manifest
    target_ref: file:repository_manifest
    semantic_strength: direct_source_confirmed
    operational_reason: "Generator writes repository_manifest.yml from deterministic filesystem traversal."
    evidence_refs:
      - evidence:source:generate_repository_manifest

  - relationship_id: rel:load_order:data:before:state
    relationship_group: runtime_load_order
    relationship_type: depends_on_load_order
    source_ref: file:js/data
    target_ref: file:js/state
    semantic_strength: direct_source_confirmed
    operational_reason: "index.html loads data.js before state.js as foundation static data before mutable state."
