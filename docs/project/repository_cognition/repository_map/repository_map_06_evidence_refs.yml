  - evidence_refs
  - provenance_links
  - verification_refs
  - file_inventory_anchor_records

must_not_store:
  - full_discovery_prose
  - extraction_history_dump
  - mandatory_live_sync_logic
  - reasoning_archives
  - synchronization_engines

