# Repository Map Evidence References Layer
# Stage 0.3.4B2 — active evidence router / provenance index for Repository Map records

meta:
  status: source_evidence_router_active
  purpose: "Lightweight evidence router / provenance index for active Repository Map records."
  scope: "Evidence anchors and provenance links only; not extraction archive, reasoning archive, synchronization layer or runtime authority."
  primary_layer: active_repository_map_topology
  verification_model: "Evidence records route claims toward runtime/source truth, filesystem/path truth and archival provenance without replacing any of them."
  discovery_role: "Discovery evidence ids remain supported as legacy archival provenance anchors only; Discovery may help locate source truth, but must not be treated as current runtime truth."

source_truth_hierarchy:
  live_truth:
    runtime_truth:
      - runtime_source_files
      - source_files_declared_in_evidence_refs
    filesystem_truth:
      - repository_manifest_yml_for_filesystem_tree
      - repository_manifest_yml_for_path_navigation
  router_layer:
    - repository_map_06_evidence_refs_yml_as_evidence_router
    - provenance_index_only
  archival_provenance:
    - discovery_archival_evidence
    - legacy_discovery_evidence_ids
  supporting_layers:
    - repository_map_current_cognition
    - discovery_archival_research_pointer
  rule: "Runtime/source files remain live runtime_truth; repository_manifest.yml remains filesystem_truth/path navigation truth; 06 routes evidence/provenance only; Discovery remains archival provenance and must not be treated as current runtime truth."

source_rebinding_plan:
  status: ongoing_supported_transition_not_record_rewrite
  current_legacy_ids:
    - evidence:discovery:batch01
    - evidence:discovery:batch02
    - evidence:discovery:batch03a
    - evidence:discovery:batch03b
    - evidence:discovery:batch03c
    - evidence:discovery:batch04
    - evidence:discovery:batch05
    - evidence:discovery:batch06
    - evidence:discovery:batch07
    - evidence:discovery:batch08
  current_source_ids: "Source evidence anchors already exist and support active Repository Map records."
  doctrine:
    - "Legacy discovery ids remain supported as discovery_archival_evidence / archival provenance anchors."
    - "Source evidence ids should be preferred for live verification when a runtime/source claim is checked."
    - "repository_manifest.yml should be used for filesystem_truth and path navigation truth."
    - "Do not rewrite Discovery files."
    - "Do not treat Discovery as current runtime truth."
    - "Do not treat source rebinding as complete forever; future bounded integrity checks may still add or refine evidence routing when explicitly authorized."

infrastructure_direct_source_evidence:
  status: active_source_evidence_anchors_exist
  target_files:
    - repository_manifest.yml
    - scripts/generate_repository_manifest.py
    - .github/workflows/update-repository-manifest.yml
  active_evidence_ids:
    - evidence:source:repository_manifest
    - evidence:source:generate_repository_manifest
    - evidence:source:update_repository_manifest_workflow
  rule: "Infrastructure/path evidence should route directly to source/filesystem truth; repository_manifest.yml is filesystem_truth/path navigation truth, while 06 remains an evidence router/provenance index only."

stores:
  - evidence_refs
  - provenance_links
  - verification_refs
  - file_inventory_anchor_records

must_not_store:
  - full_discovery_prose
  - extraction_history_dump
  - mandatory_live_sync_logic
  - reasoning_archives
  - synchronization_engines

