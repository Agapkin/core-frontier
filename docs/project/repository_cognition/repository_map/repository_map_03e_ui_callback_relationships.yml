meta:
  status: populated_source_verified
  stage: "0.3.4B1"
  role: "UI callback and runtime command dispatch bridge topology."
  purpose: "Store UI controls/panels/callback relationships that dispatch runtime commands without implying gameplay ownership."
  migration_note: "First bounded source-confirmed UI callback bridge records populated in Stage 0.3.4B1 / Pass 03E-P1."
  authority_model: "Runtime/source files and repository_manifest.yml remain verification authority."
  non_goals:
    - runtime_authority
    - generated_dependency_graph
    - full_call_graph
    - parser_dump
    - speculative_topology

relationship_scope:
  relationship_groups:
    - runtime_ui_callback_bridges
  allowed_relationship_types:
    - bridges_to
    - calls_without_ownership
    - calls
    - mutates_without_owning_shape
  admission_notes:
    - "Callback dispatch does not imply callback ownership."
    - "Avoid callback wiring graph explosion."
    - "Do not store every DOM event listener unless operationally significant."

