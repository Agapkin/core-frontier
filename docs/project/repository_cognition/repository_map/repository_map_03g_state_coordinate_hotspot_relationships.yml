    - calls
    - mutates
    - mutates_without_owning_shape
  admission_notes:
    - "Coordinate mapping and state mutation records are high entropy."
    - "Avoid mutation graph explosion."
    - "Only include relationships with clear topology/risk value."
    - "If this file grows too large, future split into separate coordinate and mutation files may be required."

