  - function_records
  - relationship_records
  - discovery_prose
  - generated_snapshots
  - dependency_graph_dump
  - refactor_plan
  - automation_logic

critical_distinctions:
  - "calls != owns"
  - "visualization != gameplay ownership"
  - "helper != lifecycle authority"
  - "active authority != inactive artifact"
  - "runtime truth != semantic interpretation"
  - "pressure marker != implementation fact"
  - "pressure marker != refactor command"
  - "not_implemented != planned system"
  - "callback wiring != callback ownership"
  - "downstream mutation != foundation state shape ownership"

clarification_notes:
  downstream_mutation_marker_pair:
    authority_type: "downstream_mutation_without_state_shape_ownership describes files that mutate shared runtime state without owning the foundation state shape."
    boundary_marker: "downstream_mutation_not_state_shape_ownership preserves the interpretation rule that mutation does not imply state-shape ownership."

normalization_notes:
  alias_risks:
    - "tower / placed object / selected object must not be silently normalized."
    - "helper / lifecycle authority must remain separate."
    - "orchestration / mixed responsibility must not imply clean architecture."
    - "render entity / gameplay entity must remain distinct."
    - "not_implemented markers preserve current absence, not future commitment."
    - "generic_object_system_not_implemented is narrower than generic_object_not_implemented and matches source/discovery wording."
  speculative_terms_blocked:
    - ecs_runtime
    - generic_object_system_as_existing
    - command_router_as_existing
    - render_engine_as_existing
    - css_framework_as_existing
    - automation_as_existing
    - parser_scanner_as_existing

