# Repository Map 04b DOM Control Surfaces
# Stage 0.3.4B2 — populated/stabilized split topology layer

meta:
  status: populated_source_verified
  stage: 0.3.4B2
  role: "DOM control surfaces split for Repository Map section 04."
  parent_router: docs/project/repository_cognition/repository_map/repository_map_04_surfaces.yml
  authority_model: "Runtime/source files remain truth."
  population_status: first_bounded_dom_control_surfaces_populated

scope:
  stores:
    - bottom_control_panel
    - speed_panel
    - zoom_panel
    - build_confirm_panel
    - tower_action_panel
    - topbar_chips
  domain_notes:
    - "This split is reserved for DOM control surface topology only."
    - "Callback/control wiring does not imply gameplay ownership."

must_not_store:
  - gameplay_ownership
  - function_inventory
  - call_graph_structures
  - relationship_topology
  - raw_discovery_prose
  - refactor_commands

required_record_shape:
  surface_id:
  surface_type:
  semantic_domain:
  status:
  authority_type:
  owner_refs: []
  created_by_refs: []
  updated_by_refs: []
  rendered_by_refs: []
  source_files: []
  source_selectors: []
  runtime_roots: []
  function_refs: []
  relationship_refs: []
  evidence_refs: []
  risk_refs: []
  pressure_refs: []
  does_not_own: []
  notes: []

anti_entropy_notes:
  - "Keep 04b records bounded and source-grounded."
  - "Do not store DOM snapshots, call graphs or gameplay ownership claims."
  - "Do not add or change populated records without explicit bounded authorization."

surface_records:
  - surface_id: surface:dom:bottom_control_panel
    surface_type: dom_panel
    semantic_domain: dom_control_surface
    status: active_runtime
    authority_type: surface_authority
    owner_refs:
      - file:js/ui/controls
      - file:js/ui/layout
    created_by_refs:
      - function:createBottomControlPanel
    updated_by_refs:
      - function:createDynamicUI
    rendered_by_refs: []
    source_files:
      - js/ui/controls.js
      - js/ui/layout.js
    source_selectors:
      - "#bottom-control-panel"
    runtime_roots:
      - document.body
    function_refs:
      - function:createDynamicUI
      - function:createBottomControlPanel
      - function:getBottomPanelStyle
    relationship_refs: []
    evidence_refs:
      - evidence:source:ui_controls
      - evidence:source:ui_layout
    risk_refs:
      - risk:selector_drift_risk
      - risk:script_order_sensitive
    pressure_refs: []
    does_not_own:
      - gameplay_logic
      - build_logic
      - wave_lifecycle
      - menu_lifecycle
    notes:
      - "Bottom gameplay command DOM panel only."
      - "Created by controls.js and styled through layout.js style factory."
