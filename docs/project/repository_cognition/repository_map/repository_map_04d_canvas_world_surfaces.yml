# Repository Map 04d Canvas World Surfaces
# Stage 0.3.4B2 — populated/stabilized split topology layer

meta:
  status: populated_source_verified
  stage: 0.3.4B2
  role: "Canvas world surfaces split for Repository Map section 04."
  parent_router: docs/project/repository_cognition/repository_map/repository_map_04_surfaces.yml
  authority_model: "Runtime/source files remain truth."
  population_status: first_bounded_canvas_world_surfaces_populated

scope:
  stores:
    - map_grid
    - road_path_base
    - tower_range_overlay
    - build_placement_overlay
    - world_render_helpers
  domain_notes:
    - "Visualization does not imply gameplay ownership."
    - "Canvas entity, HUD overlay and render sequencing records remain outside 04d."

must_not_store:
  - gameplay_ownership
  - function_inventory
  - call_graph_structures
  - relationship_topology

required_record_shape:
  surface_id:
  surface_type:
  semantic_domain:
  status:
  authority_type:
  owner_refs: []
  created_by_refs: []
  updated_by_refs: []
  rendered_by_refs: []
  source_files: []
  source_selectors: []
  runtime_roots: []
  function_refs: []
  relationship_refs: []
  evidence_refs: []
  risk_refs: []
  pressure_refs: []
  does_not_own: []
  notes: []

anti_entropy_notes:
  - "Keep 04d records bounded and source-grounded."
  - "Do not convert canvas world visualization into gameplay/system ownership."
  - "Do not add or change populated records without explicit bounded authorization."

