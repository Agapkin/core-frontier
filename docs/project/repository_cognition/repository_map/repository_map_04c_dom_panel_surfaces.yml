  surface_type:
  semantic_domain:
  status:
  authority_type:
  owner_refs: []
  created_by_refs: []
  updated_by_refs: []
  rendered_by_refs: []
  source_files: []
  source_selectors: []
  runtime_roots: []
  function_refs: []
  relationship_refs: []
  evidence_refs: []
  risk_refs: []
  pressure_refs: []
  does_not_own: []
  notes: []

anti_entropy_notes:
  - "Keep 04c records bounded and source-grounded."
  - "Do not store canvas overlay drawing logic as DOM panel surface topology."
  - "Do not add or change populated records without explicit bounded authorization."

