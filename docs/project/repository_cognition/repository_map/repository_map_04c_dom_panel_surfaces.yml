# Repository Map 04c DOM Panel Surfaces
# Stage 0.3.4B2 — populated/stabilized split topology layer

meta:
  status: populated_source_verified
  stage: 0.3.4B2
  role: "DOM panel surfaces split for Repository Map section 04."
  parent_router: docs/project/repository_cognition/repository_map/repository_map_04_surfaces.yml
  authority_model: "Runtime/source files remain truth."
  population_status: first_bounded_dom_panel_surfaces_populated

scope:
  stores:
    - menu_panel
    - game_over_dom_panel
    - dom_visibility_sync
    - hud_text_sync
  domain_notes:
    - "This split is reserved for DOM panel topology only."
    - "Canvas overlay drawing remains reserved for 04f canvas HUD overlay surfaces."

must_not_store:
  - gameplay_ownership
  - function_inventory
  - call_graph_structures
  - relationship_topology
  - raw_discovery_prose

