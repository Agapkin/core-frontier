    boundary_notes:
      - active_authority_not_inactive_artifact
      - pressure_marker_not_refactor_command
    risk_refs:
      - risk:css_activation_migration_pressure
      - risk:selector_drift_risk
    evidence_refs:
      - evidence:discovery:batch08

anti_entropy_notes:
  - "File records are compact semantic inventory only."
  - "Do not add function bodies or detailed function records here."
  - "Do not expand this layer into a relationship graph."
  - "Discovery prose remains in Discovery; this file stores compressed file-level cognition."
  - "Runtime/source code remains absolute authority."
