  - file_id: file:index_html
    path: index.html
    kind: surface_file
    layer: surface_entry
    role: "Browser entrypoint, DOM/canvas root bootstrap and script loading assembly point."
    semantic_status: verified
    primary_archetype: runtime_entrypoint_html_shell
    secondary_archetypes:
      - dom_root_bootstrap_layer
      - active_inline_css_authority
      - script_order_authority
    owns_summary: "Document shell, viewport meta, active inline CSS shell styles, topbar root, game canvas root and browser-global script order."
    does_not_own_summary: "Gameplay logic, runtime state, systems execution, rendering implementation, UI component lifecycle and module loading architecture."
    reads_summary: "Browser HTML/CSS/script loading semantics."
    mutates_summary: "Initial DOM structure parsed by browser only."
    used_by_summary: "Browser startup and runtime script assembly."
    runtime_contract: "Script order is dependency-sensitive for browser-global runtime."
    forbidden_changes: "Do not change script order, DOM roots, inline CSS behavior or introduce modules/framework wording without inspection."
    authority_notes:
