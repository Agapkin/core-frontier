      - surface_authority
    boundary_notes:
      - active_authority_not_inactive_artifact
    risk_refs:
      - risk:script_order_sensitive
    evidence_refs:
      - evidence:discovery:batch08

  - file_id: file:css/style
    path: css/style.css
    kind: surface_file
    layer: surface_css
    role: "Repository CSS surface artifact for page base, canvas root, topbar, buttons, panels and responsive rules."
    semantic_status: inactive_runtime
    primary_archetype: inactive_repository_surface_css_layer
    secondary_archetypes:
      - page_canvas_base_style_layer
      - responsive_media_rule_layer
      - future_css_activation_candidate
    owns_summary: "Global sizing, page/body/canvas base styles, topbar/chip styling, button states, panel pointer behavior, menu scrollbar and responsive media rules."
    does_not_own_summary: "Gameplay logic, runtime state, script loading, UI callback behavior, canvas drawing and JS layout calculations."
    reads_summary: "Browser CSS cascade, viewport size, orientation and safe-area env values."
    mutates_summary: "Visual presentation/layout only through CSS rules; not active unless linked."
    used_by_summary: "Repository surface CSS intent; currently not linked by index.html."
    runtime_contract: "Selectors/classes/ids must stay aligned with index.html and JS-created UI elements if activated."
    forbidden_changes: "Do not change selectors, responsive breakpoints, pointer/touch behavior or layout values without inspection."
    authority_notes:
