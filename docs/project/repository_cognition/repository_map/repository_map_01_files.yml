  - file_id: file:js/ui/canvas_entities
    path: js/ui/canvas_entities.js
    kind: runtime_source
    layer: ui_render
    role: "Entity render-only visualization layer for towers, enemies, target lines and HP bars."
    semantic_status: verified
    primary_archetype: canvas_entity_render_layer
    secondary_archetypes:
      - render_only_visualization_layer
    owns_summary: "Tower/enemy rendering, selected tower highlight, target line visualization and HP bars."
    does_not_own_summary: "Enemy update, tower targeting logic, damage calculation, combat rules, selected object actions, placement lifecycle, tower creation, enemy spawning and gameplay mutations."
    reads_summary: "towers, towerTypes, selected tower state, enemies, enemyTypes, TILE_SIZE, ctx and render helpers."
    mutates_summary: "Canvas drawing state only during render pass."
    used_by_summary: "Game render flow and entity rendering pass."
    runtime_contract: "Loads after canvas_world helpers and runtime state, before game render usage."
    forbidden_changes: "Do not change draw order, combat semantics or targeting ownership without inspection."
    authority_notes:
