    boundary_notes:
      - visualization_not_gameplay_ownership
      - render_only_boundary
    risk_refs:
      - risk:future_generic_render_pressure
    evidence_refs:
      - evidence:discovery:batch03c

  - file_id: file:js/ui/notifications
    path: js/ui/notifications.js
    kind: runtime_source
    layer: ui_support
    role: "Compact canvas notification lifecycle layer."
    semantic_status: verified
    primary_archetype: notification_lifecycle_render_layer
    secondary_archetypes:
      - canvas_hud_overlay_layer
    owns_summary: "Notification queue entry creation, lifetime update and canvas notification rendering."
    does_not_own_summary: "Gameplay decisions that trigger notifications, wave lifecycle, placement lifecycle, game over logic, UI panel lifecycle, DOM control creation and gameplay state mutation."
    reads_summary: "uiState.notifications, panel flags, uiLayout, canvas width, ctx and notification fields."
    mutates_summary: "Notification queue/lifetime and canvas drawing state during notification render pass."
    used_by_summary: "Runtime feedback flow, game update loop and canvas UI render pass."
    runtime_contract: "notify accepts message intent from other systems but does not own gameplay event causes."
