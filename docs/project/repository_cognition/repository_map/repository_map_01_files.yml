    boundary_notes:
      - visualization_not_gameplay_ownership
      - pressure_marker_not_refactor_command
    risk_refs:
      - risk:mixed_responsibility
      - risk:selected_object_architecture_not_implemented
    evidence_refs:
      - evidence:discovery:batch07

  - file_id: file:js/ui/canvas_world
    path: js/ui/canvas_world.js
    kind: runtime_source
    layer: ui_render
    role: "World-space rendering, terrain/tile rendering and placement overlay visualization."
    semantic_status: verified
    primary_archetype: canvas_world_render_layer
    secondary_archetypes:
