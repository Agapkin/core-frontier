      - render_helper_layer
    owns_summary: "World render helpers, map/grid, road/path/base render, tower range overlay and build overlay visualization."
    does_not_own_summary: "Gameplay simulation, placement lifecycle, placement validation, enemy update, tower combat, pathfinding, occupancy rules and camera state ownership."
    reads_summary: "ctx, canvas, camera, map, TILE_SIZE, roadTiles, enemyPath, base, towerTypes and uiState."
    mutates_summary: "Canvas drawing state only during render pass."
    used_by_summary: "Game render flow, world rendering pass and placement overlay rendering."
