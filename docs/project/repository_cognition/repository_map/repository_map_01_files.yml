      - call_site_not_ownership
    risk_refs:
      - risk:bridge_pressure
    evidence_refs:
      - evidence:discovery:batch03a

  - file_id: file:js/ui/panels
    path: js/ui/panels.js
    kind: runtime_source
    layer: ui_panel
    role: "DOM panels, HUD text updates and canvas overlay panels."
    semantic_status: verified
    primary_archetype: mixed_ui_semantic_layer
    secondary_archetypes:
      - dom_panel_layer
      - canvas_hud_overlay_layer
      - tower_specific_panel_pressure
    owns_summary: "Menu/game-over panels, DOM visibility, HUD text updates, wave status overlay, selected tower panel, codex/info panel and game-over overlay."
    does_not_own_summary: "Gameplay logic, placement validation, tower combat, wave lifecycle, reward system and world/entity rendering."
    reads_summary: "uiState, gameState, waveState, resources, base, power, camera, gameSpeed, difficultyProfiles, towerTypes, enemyTypes, enemies, uiLayout and canvas."
    mutates_summary: "DOM panel visibility/text, menu difficulty selection and canvas overlay drawing state."
    used_by_summary: "createDynamicUI, game render/update flow and runtime UI refresh."
    runtime_contract: "Loads after UI helpers/layout/controls and after runtime systems files."
    forbidden_changes: "Do not change UI lifecycle or gameplay callbacks without inspection."
    authority_notes:
