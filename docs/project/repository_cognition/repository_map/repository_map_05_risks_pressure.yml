# Repository Map Risks and Pressure Layer
# Stage 0.3.4B — minimal anchors for file inventory refs only

meta:
  status: minimally_anchored_for_file_inventory
  purpose: "Risk markers and semantic pressure anchors referenced by repository_map_01_files.yml."
  scope: "Supporting anchors only; not full risks/pressure population."
  primary_layer: repository_map_01_files.yml

stores:
  - synchronization_risks
  - semantic_pressure_markers
  - authority_ambiguity
  - future_refactor_pressure
  - file_inventory_anchor_records

must_not_store:
  - speculative_refactor_plans
  - governance_rules
  - long_historical_reasoning
  - architecture_commands
  - full_risk_analysis

risks:
