# Repository Map Risks and Pressure Layer
# Stage 0.3.4B3 — stabilized diagnostic pressure anchor layer

meta:
  status: stabilized_diagnostic_pressure_anchor_layer
  stage: "0.3.4B3"
  purpose: "Reusable diagnostic pressure anchor layer referenced by active Repository Map records across file inventory, function inventory, topology and surface visibility layers."
  scope: "Diagnostic pressure anchors, cross-layer pressure convergence, admission basis, survivability status, ambiguity status, escalation boundaries and future index anchor hints only."
  primary_layer: active_repository_map_diagnostic_support
  authority_model: "Runtime/source files remain authoritative truth; 05 does not own runtime architecture decisions."
  index_readiness: "Prepared for future index-layer readability, but not an index runtime, parser, scanner, automation engine or decision system."
  supports_refs_from:
    - file_inventory_refs
    - function_inventory_refs
    - topology_surface_visibility_refs
    - evidence_refs
    - future_hotspot_refs

stores:
  - diagnostic_pressure_anchors
  - semantic_pressure_visibility_markers
  - authority_ambiguity_markers
  - cross_layer_pressure_convergence
  - admission_basis
  - survivability_status
  - ambiguity_status
  - escalation_boundaries
  - future_index_anchor_hints
  - cross_map_support_records

must_not_store:
  - speculative_refactor_plans
  - governance_rules
  - long_historical_reasoning
  - architecture_commands
  - full_risk_analysis
  - generic_danger_registry
  - automation_logic
  - parser_logic
  - reasoning_engine_state
  - implementation_roadmap
  - index_runtime_logic
  - scanner_contract
  - final_schema_authority

record_shape:
  risk_id: "Stable risk/pressure anchor id. Existing ids must not be renamed without explicit migration."
  risk_type: "Current Repository Map risk vocabulary type or local pressure risk type pending vocab normalization."
  pressure_family: "Higher-level pressure family used for 05 admission grouping."
  related_refs: "Repository Map refs affected by or supporting this pressure."
  source_layers: "Lower Repository Map layers from which the pressure emerged."
  admission_basis: "Why this signal deserves 05 visibility."
  survivability_status: "strong | medium | weak | unresolved"
  ambiguity_status: "clear | ambiguity_preserved | overinference_risk"
  escalation_boundary: "What this pressure does not authorize."
  future_layer_refs: "Soft routing hints toward 06/07/08; not execution authorization."
  index_anchor_hints: "Hints for future index consumption; not current index behavior."
  status: "Current stabilization/admission state."
  severity: "low | medium | high"
  short_description: "Compact pressure statement."
  evidence_refs: "Evidence/provenance refs."
  notes: "Bounded explanatory notes."

pressure_families:
  runtime_density_pressure:
    description: "Pressure from lifecycle density, orchestration density, update/render sequencing or runtime concentration."
  bridge_pressure:
    description: "Pressure from callback, UI/runtime, command dispatch or cross-domain bridge behavior."
  render_boundary_pressure:
    description: "Pressure from render-only or visualization-only boundaries that must not be collapsed into gameplay ownership."
  synchronization_pressure:
    description: "Pressure from load order, selector alignment, CSS/HTML/JS activation or runtime synchronization dependency."
  future_architecture_pressure:
    description: "Pressure from visible growth vectors where current implementation remains narrower than likely future needs."
  cognition_distortion_pressure:
    description: "Pressure from recurring false inference risks in GPT-mediated repository cognition."
  topology_collapse_pressure:
    description: "Pressure from reasoning attempts to collapse split topology into premature monolithic or canonical subsystem structures."
  admission_instability_pressure:
    description: "Pressure from unstable/manual candidate admission and non-systematic 05 population behavior."

