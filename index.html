<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CORE FRONTIER</title>

  <meta name="description"
    content="Core Frontier — модульная survival / tower-defense стратегия с развитием базы, ресурсами и автоматизацией." />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- HUD -->
  <div id="ui">

    <div class="topbar">

      <div class="resource">
        🌲 <span id="wood">0</span>
      </div>

      <div class="resource">
        🪨 <span id="stone">0</span>
      </div>

      <div class="resource">
        🍖 <span id="food">0</span>
      </div>

      <div class="resource">
        ❤️ База:
        <span id="hp">100</span>
      </div>

    </div>

    <!-- Controls -->
    <div class="buttons">

      <button onclick="buildTower()">
        🏹 Башня
      </button>

      <button onclick="startWave()">
        ⚔️ Волна
      </button>

    </div>

  </div>

  <!-- Game Canvas -->
  <canvas id="game"></canvas>

  <!-- Main Game Logic -->
  <script src="js/game.js"></script>

</body>

</html>
