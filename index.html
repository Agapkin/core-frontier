<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>CORE FRONTIER</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #111;
      color: white;

      font-family: Arial, sans-serif;

      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;

      width: 100vw;
      height: 100vh;

      background: #183b22;

      touch-action: none;
    }

    /* ---------- ROOT LAYERS ---------- */

    #hud-root,
    #overlay-root,
    #tutorial-root {
      position: fixed;
      inset: 0;

      pointer-events: none;
    }

    #hud-root {
      z-index: 20;
    }

    #overlay-root {
      z-index: 40;
    }

    #tutorial-root {
      z-index: 60;
    }

    /* ---------- TOPBAR ---------- */

    .topbar {
      position: fixed;

      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);

      display: flex;
      flex-wrap: wrap;

      gap: 4px;

      padding: 8px;

      z-index: 20;

      pointer-events: none;
    }

    .resource {
      background: rgba(0, 0, 0, 0.72);

      padding: 5px 8px;

      border-radius: 8px;

      font-size: 13px;
      font-weight: bold;

      color: white;

      white-space: nowrap;

      pointer-events: auto;

      user-select: none;
      -webkit-user-select: none;
    }

    /* ---------- BUTTONS ---------- */

    button {
      font-family: Arial, sans-serif;

      user-select: none;
      -webkit-user-select: none;

      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 760px) {
      .topbar {
        gap: 3px;
        padding: 6px;
      }

      .resource {
        font-size: 11px;
        padding: 4px 6px;
      }
    }

    /* ---------- LANDSCAPE MOBILE ---------- */

    @media (max-width: 900px) and (orientation: landscape) {
      .topbar {
        max-width: calc(100vw - 170px);
      }

      .resource {
        font-size: 10px;
        padding: 3px 5px;
      }
    }
  </style>
</head>

<body>
  <!-- HUD ROOT -->
  <div id="hud-root">
    <div class="topbar" id="topbar"></div>
  </div>

  <!-- OVERLAYS -->
  <div id="overlay-root"></div>

  <!-- TUTORIAL / FTUE -->
  <div id="tutorial-root"></div>

  <!-- GAME -->
  <canvas id="game"></canvas>

  <!-- CORE -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/systems.js"></script>

  <!-- UI -->
  <script src="js/ui/helpers.js"></script>
  <script src="js/ui/layout.js"></script>
  <script src="js/ui/controls.js"></script>
  <script src="js/ui/panels.js"></script>

  <script src="js/ui/canvas_world.js"></script>
  <script src="js/ui/canvas_entities.js"></script>
  <script src="js/ui/notifications.js"></script>

  <!-- GAME LOOP -->
  <script src="js/game.js"></script>
</body>
</html>
