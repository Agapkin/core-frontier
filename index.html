<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>CORE FRONTIER</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;

      width: 100%;
      height: 100%;

      background: #111;
      color: white;

      font-family: Arial, sans-serif;

      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;

      width: 100vw;
      height: 100vh;

      background: #183b22;

      touch-action: none;
    }

    .topbar {
      position: fixed;

      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);

      display: flex;
      flex-wrap: wrap;
      gap: 4px;

      padding: 8px;

      z-index: 20;

      pointer-events: none;
    }

    .resource {
      background: rgba(0, 0, 0, 0.72);

      padding: 5px 8px;

      border-radius: 8px;

      font-size: 13px;
      font-weight: bold;

      color: white;

      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font-family: Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 760px) {
      .topbar {
        gap: 3px;
        padding: 6px;
      }

      .resource {
        font-size: 11px;
        padding: 4px 6px;
      }
    }

    @media (max-width: 760px) and (orientation: landscape) {
      .topbar {
        max-width: calc(100vw - 160px);
      }

      .resource {
        font-size: 10px;
        padding: 3px 5px;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="resource" id="wood-chip">🌲 <span id="wood">0</span></div>
    <div class="resource" id="stone-chip">🪨 <span id="stone">0</span></div>
    <div class="resource" id="food-chip">🍖 <span id="food">0</span></div>
    <div class="resource" id="hp-chip">❤️ <span id="hp">100</span></div>
  </div>

  <canvas id="game"></canvas>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/systems.js"></script>

  <script src="js/ui/helpers.js"></script>
  <script src="js/ui/layout.js"></script>
  <script src="js/ui/controls.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/ui/canvas_world.js"></script>
  <script src="js/ui/canvas_entities.js"></script>
  <script src="js/ui/notifications.js"></script>

  <script src="js/game.js"></script>
</body>
</html>
