<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>CORE FRONTIER</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #183b22;
      touch-action: none;
    }

    .topbar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;

      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      z-index: 50;
      pointer-events: none;
    }

    .resource {
      background: rgba(0, 0, 0, 0.72);
      border-radius: 10px;
      padding: 8px 12px;

      font-size: 14px;
      font-weight: bold;

      color: white;

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    button {
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="resource">🌲 <span id="wood">0</span></div>
    <div class="resource">🪨 <span id="stone">0</span></div>
    <div class="resource">🍖 <span id="food">0</span></div>
    <div class="resource">❤️ <span id="hp">0</span></div>
  </div>

  <canvas id="game"></canvas>

  <!-- DATA -->
  <script src="js/data.js"></script>

  <!-- STATE -->
  <script src="js/state.js"></script>

  <!-- SYSTEMS -->
  <script src="js/systems.js"></script>

  <!-- UI -->
  <script src="js/ui.js"></script>

  <!-- CORE -->
  <script src="js/game.js"></script>
</body>
</html>
